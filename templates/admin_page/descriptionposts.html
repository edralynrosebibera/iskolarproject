
 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>All Scholarship Descriptions</title>
  <link rel="stylesheet" href="{% static 'admin_page/style.css' %}?v=3">
</head>
<body>
  <header>
    <h1>📚 All Scholarship Description Pages</h1>
    <nav>
      <button onclick="window.location.href='/admin-page/create-post/'" class="ghost">+ Create New Post</button>
      <button onclick="window.location.href='/admin-page/posts/'">Back to Posts</button>
    </nav>
  </header>

  <main class="container">
    <div id="descriptionListContainer"></div>
  </main>

    <div id="confirmModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <p id="confirmMessage">Are you sure?</p>

      <div class="modal-actions">
        <button id="confirmNo" class="modal-btn cancel">Cancel</button>
        <button id="confirmYes" class="modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{% static 'admin_page/descriptionposts.js' %}?v=9"></script>
</body>
</html>
