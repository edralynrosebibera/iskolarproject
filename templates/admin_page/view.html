{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scholarship Details</title>
  <link rel="stylesheet" href="{% static 'admin_page/style.css' %}?v=3">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="viewTitle">Scholarship Details</h1>
      <nav>
        <!-- Back button (dynamic destination) -->
        <button id="backBtn" class="ghost">Back</button>
      </nav>
    </header>

    <main class="container">
      <!-- Description content -->
      <section id="contentContainer"></section>

      <!-- Requirements upload area -->
      <section class="view-box">
        <h2>📁 File Requirements</h2>
        <div class="total-progress-container">
          <div class="total-progress-text" id="progressText">Progress: 0/0 files uploaded</div>
          <div class="total-progress-bar">
            <div class="total-progress-fill"></div>
          </div>
        </div>
        <div id="requirementsContainer"></div>
      </section>
    </main>

    <div style="max-width:900px;margin:0 auto;padding:12px;">
      <button id="submitAllBtn" class="submit-all">Submit All Files</button>
      <div id="submitMsg" class="text-muted" style="margin-top:8px;"></div>
    </div>
  </div>

      <div id="confirmModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <p id="confirmMessage">Are you sure?</p>

      <div class="modal-actions">
        <button id="confirmNo" class="modal-btn cancel">Cancel</button>
        <button id="confirmYes" class="modal-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <!-- User info passed from Django session -->
  <script>
  window.loggedInUser = {
    id: "{{ django_user_id|escapejs }}",
    name: "{{ django_user_name|escapejs }}",
    email: "{{ django_user_email|escapejs }}"
  };

  document.addEventListener("DOMContentLoaded", () => {
    const backBtn = document.getElementById("backBtn");

    if (!backBtn) {
      console.error("❌ Back button not found!");
      return;
    }

    backBtn.addEventListener("click", () => {
      console.log("🔎 Logged in user email:", window.loggedInUser.email);

      if (window.loggedInUser.email === "iskolarAdmin@gmail.com") {
        window.location.href = "/admin-page/description-posts/";
      } else {
        window.location.href = "/homepage/";
      }
    });
  });
</script>




  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your JS logic -->
  <script src="{% static 'admin_page/view.js' %}?v=32"></script>
</body>
</html>
