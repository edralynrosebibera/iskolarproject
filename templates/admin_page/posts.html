{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Posts</title>
  <link rel="stylesheet" href="{% static 'admin_page/posts.css' %}?v=10">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-left">
        <h1>Manage Scholarships</h1>
        <p class="subtitle">Create, edit, and manage scholarship listings</p>

        <div class="controls">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="Search scholarships...">
          </div>
          <button id="archiveExpired" class="archive-btn">Archive Expired</button>
        </div>
      </div>

      <div class="hero-right">
        <a href="{% url 'analytics' %}" class="analytics-btn" style="margin-right:12px; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">📊 Analytics</a>
        <button class="create-btn" onclick="goToCreatePost()">➕ Add Scholarship</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="table-wrap">
      <table id="postsTable" class="posts-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Deadline</th>
            <th>Applicants</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="postsContainer">
          <!-- rows injected by posts2.js -->
        </tbody>
      </table>
    </div>
  </main>

  <div id="confirmDialog" class="dialog hidden">
    <div class="dialog-box">
      <h3>Are you sure?</h3>
      <p>This action cannot be undone. This will permanently delete the scholarship post.</p>
      <div class="dialog-actions">
        <button id="cancelBtn" class="cancel-btn">Cancel</button>
        <button id="deleteBtn" class="delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="{% static 'admin_page/posts2.js' %}?v=10"></script>
</body>
</html>
