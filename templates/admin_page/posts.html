{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Posts</title>
  <link rel="stylesheet" href="{% static 'admin_page/posts.css' %}?v=5">
</head>
<body>
  <header class="topbar">
    <div class="logo">✨</div>
    <div class="header-text">
      <h1>Posts Created</h1>
      <p>Manage your scholarship posts</p>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="create-btn" onclick="goToCreatePost()">➕ Create Post</button>
      <a href="{% url 'analytics' %}" 
       class="analytics-btn"
       style="text-decoration: none; display: flex; align-items: center; gap: 6px;"
    >
        📊 Analytics
    </a>
      <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
  </header>

  <main class="content">
    <div id="postsContainer" class="posts-grid"></div>
  </main>

  <div id="confirmDialog" class="dialog hidden">
    <div class="dialog-box">
      <h3>Are you sure?</h3>
      <p>This action cannot be undone. This will permanently delete the scholarship post.</p>
      <div class="dialog-actions">
        <button id="cancelBtn" class="cancel-btn">Cancel</button>
        <button id="deleteBtn" class="delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="{% static 'admin_page/posts2.js' %}?v=10"></script>
</body>
</html>
